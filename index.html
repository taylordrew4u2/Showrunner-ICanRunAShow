  <body>
    <!-- Boot splash: shown instantly (pure CSS, no JS/framework needed) so a
         cold launch from the home-screen icon reads as an app opening, not a
         page loading. Removed by main.tsx right after React mounts. -->
    <div id="boot-splash" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="100" fill="#ffffff"/>
        <rect x="2" y="2" width="508" height="508" rx="98" fill="none" stroke="#e0e0e0" stroke-width="4"/>
        <path d="M190 160 L190 352 L366 256 Z" fill="#dc2626"/>
      </svg>
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        transition: opacity 0.2s ease;
      }
      #boot-splash.boot-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
